<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>font Properties</title>

    <style>
      .font1 {
        font-family: Arial, sans-serif;
      }

      .font2 {
        font-size: 25px;
      }

      .font3 {
        font-weight: bold;
      }

      .font4 {
        font-style: italic;
      }

      .font5 {
        font-variant: small-caps;
      }
      .font6 {
        font:
          bold italic 24px georigia,
          serif;
      }
    </style>
  </head>
  <body>
    <h2 class="font1">Arial Font Family</h2>
    <p class="font2">Font Size Example</p>
    <p class="font3">Bold Text Example</p>
    <p class="font4">Italic Text Example</p>
    <p class="font5">Small Capitals Example</p>
    <p class="font6">Font Shorthand Example</p>
  </body>
</html>
