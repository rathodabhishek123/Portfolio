<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display Properties</title>

    <style>
      .block {
        display: block;
        background-color: lightblue;
      }

      .inline {
        display: inline;
        background-color: lightgreen;
      }

      .inline-block {
        display: inline-block;
        width: 150px;
        height: 50px;
        background-color: orange;
      }

      .hidden {
        display: none;
      }

      .flex-container {
        display: flex;
        gap: 10px;
        background-color: lightgray;
        padding: 10px;
      }

      .flex-container div {
        background-color: skyblue;
        padding: 15px;
      }

      .grid-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 20px;
      }

      .grid-container div {
        background-color: lightgreen;
        padding: 15px;
      }
    </style>
  </head>
  <body>
    <h2>Block</h2>
    <div class="block">Block Element</div>

    <h2>Inline</h2>
    <span class="inline">Inline 1</span> <span class="inline">Inline 2</span>

    <h2>Inline Block</h2>
    <div class="inline-block">Box 1</div>
    <div class="inline-block">Box 2</div>

    <h2>Display None</h2>
    <p class="hidden">This paragraph is hidden.</p>
    <p>The hidden paragraph occupies no layout space.</p>
    <div class="flex-container">
      <div>Item 1</div>
      <div>Item 2</div>
      <div>Item 3</div>
    </div>

    <h2>Grid</h2>
    <div class="grid-container">
      <div>Item 1</div>
      <div>Item 2</div>
      <div>Item 3</div>
      <div>Item 4</div>
    </div>
  </body>
</html>
