<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padding Properties</title>

    <style>
      .box1 {
        padding: 25px;
        background-color: lightblue;
        border: 2px solid blue;
      }

      .box2 {
        padding-top: 10px;
        padding-right: 30px;
        padding-bottom: 20px;
        padding-left: 40px;

        background-color: lightgreen;
        border: 2px solid green;
      }
    </style>
  </head>
  <body>
    <div class="box1">Padding of 25px on all sides</div>
    <br />
    <div class="box2">Different padding on each side</div>
  </body>
</html>
