<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border Properties</title>

    <style>
      .border1 {
        border: 3px solid black;
        padding: 10px;
      }

      .border2 {
        border-width: 5px;
        border-style: dashed;
        border-color: red;
        padding: 10px;
      }

      .border3 {
        border: 3px solid blue;
        border-radius: 15px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <p class="border1">Solid Border Example</p>
    <p class="border2">Dashed Red Border Example</p>
    <div class="border3">Rounded Border Example</div>
  </body>
</html>
