<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Properties</title>
    <style>
      .text-color {
        color: blue;
      }

      .background {
        background-color: lightyellow;
        padding: 20px;
      }

      .transparent {
        background-color: green;
        color: white;
        padding: 20px;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <h2 class="text-color">This text is blue</h2>

    <p class="background">This paragraph has a light yellow backgraound</p>

    <div class="transparent">This box is 50% opaque</div>
  </body>
</html>
