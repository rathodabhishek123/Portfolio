<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin Properties</title>

    <style>
      body {
        background-color: lightgray;
      }

      .box1 {
        margin: 20px;
        background-color: lightblue;
      }

      .box2 {
        margin-top: 30px;
        margin-right: 40px;
        margin-bottom: 20px;
        margin-left: 50px;
        background-color: blueviolet;
      }
    </style>
  </head>
  <body>
    <div class="box box1">Margin of 20px on all sides</div>
    <div class="box box2">Different margin on each side</div>
  </body>
</html>
