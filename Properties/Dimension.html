<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dimension Properties</title>

    <style>
      .box1 {
        width: 300px;
        height: 100px;
        background-color: lightblue;
      }

      .box2 {
        width: 100%;
        min-width: 200px;
        max-width: 500px;

        min-height: 100px;
        max-height: 200px;

        background-color: lightgreen;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h2>Fixed Dimensions</h2>
    <div class="box1">Width: 300px; Height: 100px</div>

    <h2>Minimum and Maximum Dimensions</h2>
    <div class="box2">This box has minimum and maximum dimensions.</div>
  </body>
</html>
