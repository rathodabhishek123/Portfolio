<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Properties</title>
    <style>
      .align {
        text-align: center;
      }

      .decoration {
        text-decoration: underline;
      }

      .transform {
        text-transform: uppercase;
      }

      .indent {
        text-indent: 40px;
      }

      .shadow {
        text-shadow: 2px 2px 4px gray;
      }

      .letters {
        letter-spacing: 10px;
      }

      .word {
        word-spacing: 10px;
      }

      .height {
        line-height: 2;
      }
    </style>
  </head>
  <body>
    <h2 class="align">Centered Text</h2>

    <p class="decoration">Underlined Text</p>

    <p class="transform">this text becomes uppercase</p>

    <p class="indent">
      This paragraph demonstrates indentation. The first line starts with extra
      space.
    </p>

    <h2 class="shadow">Text shadow Example</h2>

    <p class="letters">Letter Spacing Example</p>

    <p class="word">Word Spacing Example</p>

    <p class="height">
      This is the first line. <br />
      This is the second line. <br />
      This is the third line.
    </p>
  </body>
</html>
