<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Properties</title>

    <style>
      .container {
        display: flex;

        flex-direction: row;
        justify-content: space-between;
        align-items: center;

        flex-wrap: wrap;
        gap: 15px;

        min-height: 200px;
        padding: 20px;

        background-color: lightgray;
      }

      .item {
        flex-grow: 1;
        flex-shrink: 1;

        padding: 25px;
        background-color: lightblue;
        border: 1px solid blue;
      }

      .item1 {
        flex-grow: 2;
      }

      .item2 {
        flex-shrink: 0;
      }

      .column-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
        padding: 15px;
        background-color: lightyellow;
      }

      .column-container div {
        padding: 15px;
        background-color: orange;
      }
    </style>
  </head>
  <body>
    <h2>Flexbox Row Layout</h2>
    <div class="container">
      <div class="item item1">Item 1</div>
      <div class="item item2">Item 2</div>
      <div class="item">Item 3</div>
    </div>

    <h2>Flexbox Column Layout</h2>
    <div class="column-container">
      <div>Item 1</div>
      <div>Item 2</div>
      <div>Item 3</div>
    </div>
  </body>
</html>
